name: Syrox Full Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile and Jar
        run: |
          mkdir -p build/libs
          javac src/main/java/SyroxGui.java -d .
          jar cfe build/libs/SyroxCheat.jar SyroxGui *.class
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: Syrox-Final-Jar
          path: build/libs/*.jar
