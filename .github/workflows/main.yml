name: Syrox 1.21.4 Build
on: [push]
jobs:
  build:
    - name: Build with Gradle
        run: gradle build --stacktrace --info
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1 # Wrapper dosyası olmadan doğrudan Gradle kurar

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: Syrox-Final-1.21.4
          path: build/libs/*-dev.jar
